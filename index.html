<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لوحة التحكم الآمنة - المطعم المصري</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { 50: '#fdf8f6', 100: '#f2e8e5', 500: '#d35400', 600: '#e67e22', 700: '#a04000' } },
          fontFamily: { cairo: ['Cairo', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20 overflow-x-hidden">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 px-3 sm:px-4 py-3 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center gap-2">
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <button onclick="toggleSidebar()" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-brand-500 flex-shrink-0 flex items-center justify-center transition">
          <i class="fa-solid fa-bars text-sm sm:text-base"></i>
        </button>
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-brand-500 flex-shrink-0 flex items-center justify-center font-black text-white shadow-lg">
          <i class="fa-solid fa-gauge-high text-sm sm:text-base"></i>
        </div>
        <div class="min-w-0">
          <h1 class="font-extrabold text-xs sm:text-base text-white truncate" id="headerStoreName">إدارة المطعم المصري</h1>
          <p class="text-[9px] sm:text-[10px] text-emerald-400 font-bold flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>متصل بقاعدة البيانات السحابية</span>
          </p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
        <a href="index.html" target="_blank" class="bg-slate-800 hover:bg-slate-700 px-2.5 sm:px-3 py-2 rounded-xl text-[11px] sm:text-xs font-bold transition flex items-center gap-1 text-slate-300">
          <i class="fa-solid fa-globe text-brand-500"></i>
          <span class="hidden xs:inline">عرض الزبون</span>
        </a>
        <button onclick="toggleStoreStatus()" id="storeStatusBtn" class="bg-emerald-600 hover:bg-emerald-700 px-2.5 sm:px-3.5 py-2 rounded-xl text-[11px] sm:text-xs font-bold transition shadow-sm text-white">
          مفتوح 🟢
        </button>
      </div>
    </div>
  </header>

  <!-- Sidebar Drawer -->
  <div id="sidebarOverlay" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden transition-opacity" onclick="toggleSidebar()"></div>
  <aside id="sidebarDrawer" class="fixed top-0 right-0 bottom-0 w-64 sm:w-72 bg-slate-900 border-l border-slate-800 z-50 transform translate-x-full transition-transform duration-300 p-4 sm:p-5 flex flex-col justify-between overflow-y-auto">
    <div class="space-y-5">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-extrabold text-xs sm:text-sm text-white flex items-center gap-2">
          <i class="fa-solid fa-compass text-brand-500"></i>
          <span>أقسام لوحة التحكم</span>
        </h3>
        <button onclick="toggleSidebar()" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="space-y-1.5">
        <button onclick="switchTab('dashboard'); toggleSidebar();" class="w-full text-right px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2.5 bg-brand-500 text-white shadow">
          <i class="fa-solid fa-chart-pie w-4"></i> الرئيسية والتقارير
        </button>
        <button onclick="switchTab('orders'); toggleSidebar();" class="w-full text-right px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2.5 bg-slate-800 text-slate-300 hover:bg-slate-700">
          <i class="fa-solid fa-receipt w-4 text-brand-500"></i> إدارة الطلبات <span id="ordersBadge" class="bg-rose-500 text-white px-2 py-0.5 rounded-full text-[10px] mr-auto">0</span>
        </button>
        <button onclick="switchTab('products'); toggleSidebar();" class="w-full text-right px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2.5 bg-slate-800 text-slate-300 hover:bg-slate-700">
          <i class="fa-solid fa-utensils w-4 text-brand-500"></i> إدارة الأصناف والوجبات
        </button>
        <button onclick="switchTab('customers'); toggleSidebar();" class="w-full text-right px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2.5 bg-slate-800 text-slate-300 hover:bg-slate-700">
          <i class="fa-solid fa-users w-4 text-brand-500"></i> سجل العملاء
        </button>
        <button onclick="switchTab('settings'); toggleSidebar();" class="w-full text-right px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2.5 bg-slate-800 text-slate-300 hover:bg-slate-700">
          <i class="fa-solid fa-gears w-4 text-brand-500"></i> إعدادات المطعم
        </button>
        <button onclick="switchTab('extras'); toggleSidebar();" class="w-full text-right px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2.5 bg-slate-800 text-slate-300 hover:bg-slate-700">
          <i class="fa-solid fa-qrcode w-4 text-brand-500"></i> كود QR للزبائن
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-3 sm:px-4 pt-4 sm:pt-6 space-y-4">

    <!-- Dashboard -->
    <section id="tab-dashboard" class="admin-section space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
        <button onclick="switchTab('products'); openAddProductModal();" class="bg-gradient-to-r from-brand-600 to-brand-500 text-white font-bold py-3 px-3.5 rounded-xl text-xs flex items-center justify-between shadow-md">
          <div class="flex items-center gap-2"><i class="fa-solid fa-plus-circle text-sm"></i><span>إضافة وجبة جديدة</span></div>
          <i class="fa-solid fa-chevron-left text-[10px]"></i>
        </button>
        <button onclick="switchTab('orders')" class="bg-slate-900 border border-slate-800 text-white font-bold py-3 px-3.5 rounded-xl text-xs flex items-center justify-between">
          <div class="flex items-center gap-2"><i class="fa-solid fa-receipt text-brand-500 text-sm"></i><span>مراجعة الطلبات الواردة</span></div>
          <i class="fa-solid fa-chevron-left text-[10px]"></i>
        </button>
        <button onclick="switchTab('settings')" class="bg-slate-900 border border-slate-800 text-white font-bold py-3 px-3.5 rounded-xl text-xs flex items-center justify-between">
          <div class="flex items-center gap-2"><i class="fa-solid fa-gears text-brand-500 text-sm"></i><span>إعدادات المطعم</span></div>
          <i class="fa-solid fa-chevron-left text-[10px]"></i>
        </button>
      </div>

      <div class="grid grid-cols-2 lg:grid-cols-3 gap-2.5 sm:gap-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm space-y-1">
          <div class="text-slate-400 text-xs font-bold">إجمالي المبيعات</div>
          <h3 class="text-2xl font-black text-white"><span id="statTodaySales">0</span> ج</h3>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm space-y-1">
          <div class="text-slate-400 text-xs font-bold">عدد الطلبات</div>
          <h3 class="text-2xl font-black text-white" id="statTodayOrders">0 طلب</h3>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm space-y-1">
          <div class="text-slate-400 text-xs font-bold">الأصناف النشطة</div>
          <h3 class="text-2xl font-black text-white" id="statTotalItems">0 صنف</h3>
        </div>
      </div>
    </section>

    <!-- Orders -->
    <section id="tab-orders" class="admin-section hidden space-y-3">
      <h3 class="font-bold text-base text-white">سجل الطلبات الواردة</h3>
      <div id="adminOrdersContainer" class="space-y-3"></div>
    </section>

    <!-- Products -->
    <section id="tab-products" class="admin-section hidden space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base text-white">إدارة أصناف المنيو</h3>
        <button onclick="openAddProductModal()" class="bg-brand-500 text-white px-4 py-2 rounded-xl text-xs font-bold">+ صنف جديد</button>
      </div>
      <div id="adminProductsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    </section>

    <!-- Customers -->
    <section id="tab-customers" class="admin-section hidden space-y-3">
      <h3 class="font-bold text-base text-white">سجل العملاء</h3>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-sm">
        <table class="w-full text-right text-xs">
          <thead class="bg-slate-800 text-slate-400 border-b border-slate-800">
            <tr><th class="p-3">الاسم</th><th class="p-3">الهاتف</th><th class="p-3">العنوان</th></tr>
          </thead>
          <tbody id="customersTableBody" class="divide-y divide-slate-800/60"></tbody>
        </table>
      </div>
    </section>

    <!-- Settings -->
    <section id="tab-settings" class="admin-section hidden space-y-4">
      <h3 class="font-bold text-base text-white">إعدادات المطعم</h3>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">اسم المطعم</label>
          <input id="settingStoreName" type="text" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none" value="المطعم المصري">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">رقم واتساب الإدارة</label>
          <input id="settingWhatsapp" type="text" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none" value="201148041323">
        </div>
        <button onclick="saveGeneralSettings()" class="bg-brand-500 text-white font-bold py-3 px-6 rounded-xl text-xs">حفظ الإعدادات 🚀</button>
      </div>
    </section>

    <!-- QR Code -->
    <section id="tab-extras" class="admin-section hidden space-y-3">
      <h3 class="font-bold text-base text-white">كود QR الخاص بالمنيو</h3>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center space-y-4">
        <div class="bg-white p-4 rounded-2xl w-48 h-48 mx-auto flex items-center justify-center shadow-lg">
          <img id="qrImage" src="" alt="QR Code" class="w-full h-full object-contain">
        </div>
        <button onclick="window.print()" class="bg-slate-800 text-white font-bold py-2.5 px-5 rounded-xl text-xs">طباعة كود QR</button>
      </div>
    </section>
  </main>

  <!-- Product Modal -->
  <div id="productModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-5 space-y-3 shadow-2xl">
      <h3 id="productModalTitle" class="font-bold text-base text-white">إضافة أو تعديل صنف</h3>
      <input type="hidden" id="editOriginalName" value="">
      <div>
        <label class="block text-xs text-slate-300 mb-1">اسم الصنف</label>
        <input id="modalItemName" type="text" placeholder="مثال: طاجن لحم" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-slate-300 mb-1">السعر</label>
          <input id="modalItemPrice" type="number" placeholder="120" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none">
        </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1">القسم</label>
          <select id="modalItemCategory" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none">
            <option value="طواجن ورئيسي">طواجن ورئيسي</option>
            <option value="أكلات بحرية">أكلات بحرية</option>
            <option value="مشويات">مشويات</option>
            <option value="مقبلات">مقبلات</option>
            <option value="حلويات">حلويات</option>
            <option value="مشروبات ساخنة">مشروبات ساخنة</option>
            <option value="مشروبات ساقعة">مشروبات ساقعة</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs text-slate-300 mb-1">صورة الوجبة (رابط)</label>
        <input id="modalItemImgUrl" type="text" placeholder="https://..." class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none">
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="saveProductAdmin()" class="flex-grow bg-brand-500 text-white font-bold py-2.5 rounded-xl text-xs">حفظ ونشر</button>
        <button onclick="closeProductModal()" class="bg-slate-800 text-slate-300 px-4 py-2.5 rounded-xl text-xs">إلغاء</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://nktadskksxbvgvxxtyoe.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GOohTFjLF2Cjm70fLTrayA_vUlhd06f";
    let supabaseClient = null;
    let adminProducts = [];
    let adminOrders = [];
    let isStoreOpen = true;

    window.addEventListener('DOMContentLoaded', async () => {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        await loadAllData();
      }
      setupQR();
    });

    async function loadAllData() {
      await loadSettings();
      await loadProducts();
      await loadOrders();
      await loadCustomers();
    }

    async function loadSettings() {
      const { data } = await supabaseClient.from('settings').select('*').eq('id', 1).single();
      if (data) {
        isStoreOpen = data.is_open !== false;
        updateStoreButtonUI();
        if (data.store_name) {
          document.getElementById('headerStoreName').innerText = data.store_name;
          document.getElementById('settingStoreName').value = data.store_name;
        }
        if (data.whatsapp_phone) {
          document.getElementById('settingWhatsapp').value = data.whatsapp_phone;
        }
      }
    }

    async function toggleStoreStatus() {
      isStoreOpen = !isStoreOpen;
      updateStoreButtonUI();
      await supabaseClient.from('settings').upsert({ id: 1, is_open: isStoreOpen });
    }

    function updateStoreButtonUI() {
      const btn = document.getElementById('storeStatusBtn');
      if (isStoreOpen) {
        btn.innerText = 'مفتوح 🟢';
        btn.className = 'bg-emerald-600 hover:bg-emerald-700 px-2.5 sm:px-3.5 py-2 rounded-xl text-[11px] sm:text-xs font-bold transition shadow-sm text-white';
      } else {
        btn.innerText = 'مغلق 🔴';
        btn.className = 'bg-rose-600 hover:bg-rose-700 px-2.5 sm:px-3.5 py-2 rounded-xl text-[11px] sm:text-xs font-bold transition shadow-sm text-white';
      }
    }

    async function loadProducts() {
      const { data } = await supabaseClient.from('menu').select('*');
      if (data) {
        adminProducts = data;
        renderProducts();
      }
    }

    async function loadOrders() {
      const { data } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
      if (data) {
        adminOrders = data;
        renderOrders();
      }
    }

    async function loadCustomers() {
      const { data } = await supabaseClient.from('orders').select('customer_name, phone, address');
      const tbody = document.getElementById('customersTableBody');
      if (!tbody || !data) return;
      
      const uniqueCustomers = Array.from(new Set(data.map(s => s.phone)))
        .map(phone => data.find(s => s.phone === phone));

      tbody.innerHTML = uniqueCustomers.map(c => `
        <tr class="hover:bg-slate-800/40">
          <td class="p-3 font-bold text-white">${c.customer_name || 'غير معروف'}</td>
          <td class="p-3 text-slate-300">${c.phone || '-'}</td>
          <td class="p-3 text-slate-400">${c.address || '-'}</td>
        </tr>
      `).join('') || `<tr><td colspan="3" class="p-4 text-center text-slate-500">لا توجد سجلات عملاء بعد</td></tr>`;
    }

    function renderProducts() {
      const grid = document.getElementById('adminProductsGrid');
      document.getElementById('statTotalItems').innerText = adminProducts.length + ' صنف';
      grid.innerHTML = adminProducts.map((p, idx) => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col justify-between">
          <img src="${p.img || 'https://picsum.photos/seed/food/300/200'}" class="w-full h-32 object-cover rounded-xl mb-2">
          <h4 class="font-bold text-xs text-white">${p.name}</h4>
          <span class="text-brand-500 font-black text-sm my-1">${p.price} جنيه</span>
          <div class="flex gap-2 mt-2">
            <button onclick="openEditProductModal(${idx})" class="flex-grow bg-sky-500/20 text-sky-400 py-1.5 rounded-xl text-xs font-bold">تعديل ✏️</button>
            <button onclick="deleteProduct('${p.name.replace(/'/g, "\\'")}')" class="flex-grow bg-rose-500/20 text-rose-400 py-1.5 rounded-xl text-xs font-bold">حذف 🗑️</button>
          </div>
        </div>
      `).join('') || '<p class="text-xs text-slate-500 col-span-full">لا توجد أصناف</p>';
    }

    function renderOrders() {
      const container = document.getElementById('adminOrdersContainer');
      document.getElementById('ordersBadge').innerText = adminOrders.length;
      document.getElementById('statTodayOrders').innerText = adminOrders.length + ' طلب';
      
      let totalSales = 0;
      adminOrders.forEach(o => totalSales += (parseFloat(o.total) || 0));
      document.getElementById('statTodaySales').innerText = totalSales;

      container.innerHTML = adminOrders.map(ord => {
        let itemsHTML = '';
        if (ord.items && Array.isArray(ord.items)) {
          itemsHTML = ord.items.map(i => `<div class="text-[11px] text-amber-300">• ${i.name} (x${i.qty}) = ${i.price}ج</div>`).join('');
        }
        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div class="space-y-1 w-full">
              <h4 class="font-black text-xs text-white">طلب #${ord.id} - ${ord.customer_name || 'عميل'}</h4>
              <p class="text-xs text-slate-300"><b>الهاتف:</b> ${ord.phone} | <b>العنوان:</b> ${ord.address}</p>
              <div class="bg-slate-950 p-2 rounded-xl mt-1 space-y-0.5">${itemsHTML}</div>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-base font-black text-brand-500">${ord.total} جنيه</span>
              <button onclick="deleteOrder(${ord.id})" class="bg-rose-500/20 text-rose-400 px-3 py-1.5 rounded-xl text-xs font-bold"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      }).join('') || '<p class="text-xs text-slate-500">لا توجد طلبات</p>';
    }

    async function deleteOrder(id) {
      if (confirm('هل أنت متأكد من حذف الطلب؟')) {
        await supabaseClient.from('orders').delete().eq('id', id);
        await loadOrders();
      }
    }

    function openAddProductModal() {
      document.getElementById('productModalTitle').innerText = 'إضافة صنف جديد';
      document.getElementById('editOriginalName').value = '';
      document.getElementById('modalItemName').value = '';
      document.getElementById('modalItemPrice').value = '';
      document.getElementById('modalItemImgUrl').value = '';
      document.getElementById('productModal').classList.remove('hidden');
    }

    function openEditProductModal(idx) {
      const p = adminProducts[idx];
      document.getElementById('productModalTitle').innerText = 'تعديل الصنف';
      document.getElementById('editOriginalName').value = p.name;
      document.getElementById('modalItemName').value = p.name;
      document.getElementById('modalItemPrice').value = p.price;
      document.getElementById('modalItemCategory').value = p.category || 'طواجن ورئيسي';
      document.getElementById('modalItemImgUrl').value = p.img || '';
      document.getElementById('productModal').classList.remove('hidden');
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.add('hidden');
    }

    async function saveProductAdmin() {
      const oldName = document.getElementById('editOriginalName').value.trim();
      const name = document.getElementById('modalItemName').value.trim();
      const price = parseFloat(document.getElementById('modalItemPrice').value);
      const category = document.getElementById('modalItemCategory').value;
      const img = document.getElementById('modalItemImgUrl').value.trim() || 'https://picsum.photos/seed/food/300/200';

      if (!name || isNaN(price)) {
        alert('أدخل اسم الصنف والسعر بشكل صحيح');
        return;
      }

      const { error } = await supabaseClient.from('menu').upsert([{ name, price, category, img, available: true }], { onConflict: 'name' });
      if (error) {
        alert('خطأ أثناء الحفظ: ' + error.message);
        return;
      }

      if (oldName && oldName !== name) {
        await supabaseClient.from('menu').delete().eq('name', oldName);
      }

      closeProductModal();
      await loadProducts();
      alert('تم حفظ الصنف بنجاح وظهر في المنيو! 🚀');
    }

    async function deleteProduct(name) {
      if (confirm(`هل أنت متأكد من حذف ${name}؟`)) {
        await supabaseClient.from('menu').delete().eq('name', name);
        await loadProducts();
      }
    }

    async function saveGeneralSettings() {
      const store_name = document.getElementById('settingStoreName').value.trim();
      const whatsapp_phone = document.getElementById('settingWhatsapp').value.trim();
      await supabaseClient.from('settings').upsert({ id: 1, store_name, whatsapp_phone, is_open: isStoreOpen });
      alert('تم حفظ الإعدادات بنجاح! 🚀');
      await loadSettings();
    }

    function setupQR() {
      const customerMenuUrl = window.location.href.replace('admin.html', 'index.html');
      document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(customerMenuUrl)}`;
    }

    function toggleSidebar() {
      document.getElementById('sidebarDrawer').classList.toggle('translate-x-full');
      document.getElementById('sidebarOverlay').classList.toggle('hidden');
    }

    function switchTab(id) {
      document.querySelectorAll('.admin-section').forEach(s => s.classList.add('hidden'));
      document.getElementById('tab-' + id)?.classList.remove('hidden');
    }
  </script>
</body>
</html>
